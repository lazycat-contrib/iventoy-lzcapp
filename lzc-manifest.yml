application:
  subdomain: iventoy
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://host.lzcapp:26000/
  ingress:
    - protocol: tcp
      port: 16000
      service: iVentoy
    - protocol: tcp
      port: 10809
      service: iVentoy
    - protocol: udp
      port: 69
      service: iVentoy
services:
  iVentoy:
    # czyt/iventoy:v1.0.25
    # upstream: czyt/iventoy:1.0.39
    image: registry.lazycat.cloud/czyt/czyt/iventoy:442a4a0e6d7dda4f
    binds:
      - /lzcapp/var/data:/iventoy/data
      - /lzcapp/var/iso:/iventoy/iso
    network_mode: host
