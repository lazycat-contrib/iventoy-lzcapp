application:
  subdomain: iventoy
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://host.lzcapp:26000/
  ingress:
    - protocol: tcp
      port: 16000
      service: iVentoy
    - protocol: tcp
      port: 10809
      service: iVentoy
    - protocol: udp
      port: 69
      service: iVentoy
services:
  iVentoy:
    # czyt/iventoy:v1.0.25
    # upstream: czyt/iventoy:1.0.37
    image: registry.lazycat.cloud/czyt/czyt/iventoy:495fd7ef16c74c73
    binds:
      - /lzcapp/var/data:/iventoy/data
      - /lzcapp/var/user:/iventoy/user
      - /lzcapp/var/iso:/iventoy/iso
    network_mode: host
    setup_script: |
      # Refresh release-managed data while leaving the persisted config.dat untouched.
      cp -f /lzcapp/pkg/content/iventoy.dat /lzcapp/var/data/
      cp -f /lzcapp/pkg/content/mac.db /lzcapp/var/data/
      if [ ! -d /lzcapp/var/user/scripts ];then
          cp -r /lzcapp/pkg/content/user/scripts /lzcapp/var/user
      else
          echo "example scripts already exists"
      fi
